{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}
    <h1>Add New Student</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Save</button>
            <a href="{% url 'teacher_dashboard' %}" class="button-link secondary">Back</a>
        </div>
    </form>
{% endblock %}
