<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School Portal{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

        }

        body.auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }

        nav {
            background: black;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 16px;
            font-weight: bold;
        }

        nav form {
            display: inline;
        }

        button,
        .button-link {
            background: blue;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .button-link.secondary,
        button.secondary {
            background: red;
        }

        .page {
            max-width: 300px;
            margin: 40px auto;
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .page.auth-card {
            width: min(100%, 520px);
            margin: 0;
        }

        .messages {
            margin-bottom: 20px;
        }

        .message {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        form p {
            margin-bottom: 16px;
        }

        form label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            max-width: 420px;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
        }

        .narrow-form {
            max-width: 460px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        ul.errorlist {
            color: #b91c1c;
            padding-left: 18px;
        }

        .field-row {
            margin-bottom: 16px;
        }

        .wide-page {
            max-width: 760px;
            text-align: left;
        }

        .wide-page h1,
        .wide-page h2 {
            text-align: center;
        }

        .event-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 18px;
            margin-top: 16px;
            background: #ffffff;
        }

        .event-card h3 {
            margin-top: 0;
        }

        .event-time {
            color: #475569;
            font-weight: 600;
        }

        .participants ul {
            margin-bottom: 0;
        }
    </style>
</head>
<body class="{% block body_class %}{% endblock %}">
    {% if request.user.is_authenticated %}
        <nav>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="secondary">Log Out</button>
            </form>
        </nav>
    {% endif %}

    <div class="page {% block page_class %}{% endblock %}">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
